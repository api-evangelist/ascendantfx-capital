name: AscendantFX Capital
description: >-
  AscendantFX Capital, now operating as Ascendant, is a global cross-border payments and
  foreign exchange platform serving businesses and financial institutions. Its aPay platform
  sends domestic and international payments across global ACH, wire, and local payment rails
  with competitive FX rates and built-in validation, complemented by FX risk management
  (forward contracts and multi-currency support), Payee Intelligence bank-detail validation,
  and Track 360 real-time payment tracking. Ascendant supports 130+ currencies across 200+
  countries and territories for 3,000+ active customers, and integrates into finance and ERP
  stacks (NetSuite, QuickBooks, Microsoft Dynamics) via APIs and file-upload workflows. The
  company is regulated as an FCA Authorized Payments Institution (UK), a FinTRAC-registered
  and Retail Payments Activities Act payment services provider (Canada), and under US state
  money-transmitter licensing, and maintains SOC 1 & SOC 2 Type II and NYCRR 500 attestations.
